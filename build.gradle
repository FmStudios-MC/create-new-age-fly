plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // One source set, like the NeoForge original: renderers and blocks live side by side, and
    // client-only classes are kept off the server by @Environment(EnvType.CLIENT).
    accessWidenerPath = file("src/main/resources/create_new_age.classtweaker")

    mods {
        "create_new_age" {
            sourceSet sourceSets.main
        }
    }
}

// JSONs that Registrate generated for 1.21.1. There is no Registrate on 26.2, so they are kept
// and migrated to the 26.2 formats instead of being regenerated.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Datagen only: these produced the JSONs under src/generated, which are migrated by hand now.
// Kept in the tree so upstream changes to them stay visible in merges.
sourceSets.main.java {
    exclude 'org/antarcticgardens/cna/data/CNABlockStateGen.java'
    exclude 'org/antarcticgardens/cna/data/CNAGeneratedEntriesProvider.java'
    exclude 'org/antarcticgardens/cna/data/CreateNewAgeDatagen.java'
    exclude 'org/antarcticgardens/cna/data/recipe/**'
    exclude 'org/antarcticgardens/cna/content/motor/MotorBlockStateGen.java'

    // Phase 5 of the port (see PORTING.md): re-enabled once the core runs.
    exclude 'org/antarcticgardens/cna/compat/computercraft/**'
    exclude 'org/antarcticgardens/cna/compat/jei/**'
    exclude 'org/antarcticgardens/cna/content/ponders/**'

    // Phase 3 (rendering): excluded while the common code is brought to compile.
    exclude 'org/antarcticgardens/cna/**/*Renderer.java'
    exclude 'org/antarcticgardens/cna/**/*Visual.java'
    exclude 'org/antarcticgardens/cna/rendering/**'
    exclude 'org/antarcticgardens/cna/CNARenderTypes.java'
    exclude 'org/antarcticgardens/cna/CNAPartialModels.java'
    exclude 'org/antarcticgardens/cna/CNASpriteShifts.java'
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "TeamReborn"
                url = "https://maven.modmuss50.me/"
            }
        }
        filter {
            includeGroup "teamreborn"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.x ships unobfuscated (Mojang names), so there is no remapping and no mod* configurations.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The fabric-api artifact only nests the module jars, so each module used must be named.
    implementation fabricApi.module("fabric-api-base", project.fabric_version)
    implementation fabricApi.module("fabric-api-lookup-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-creative-tab-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    implementation fabricApi.module("fabric-networking-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-object-builder-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-resource-conditions-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-resource-loader-v1", project.fabric_version)
    implementation fabricApi.module("fabric-transfer-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-biome-api-v1", project.fabric_version)
    implementation fabricApi.module("fabric-rendering-v1", project.fabric_version)
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "maven.modrinth:create-fly:${project.create_fly_version}"

    implementation include("teamreborn:energy:${project.team_reborn_energy_version}")
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filteringCharset = 'UTF-8'

    def props = [
            version                 : project.version,
            minecraft_version       : project.minecraft_version,
            loader_version          : project.loader_version,
            create_fly_version_range: project.create_fly_version_range,
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    // While porting, the full error list is the worklist, not javac's default first 100.
    it.options.compilerArgs << '-Xmaxerrs' << '10000'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("CREDITS.md")
}
