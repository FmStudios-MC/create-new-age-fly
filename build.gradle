plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // One source set, like the NeoForge original: renderers and blocks live side by side, and
    // client-only classes are kept off the server by @Environment(EnvType.CLIENT).
    accessWidenerPath = file("src/main/resources/create_new_age.accesswidener")

    mods {
        "create_new_age" {
            sourceSet sourceSets.main
        }
    }
}

// JSONs that Registrate generated for 1.21.1. There is no Registrate on Create Fly, so they are kept
// and migrated to the 1.21.8 formats instead of being regenerated.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Datagen only: these produced the JSONs under src/generated, which are migrated by hand now.
// Kept in the tree so upstream changes to them stay visible in merges.
sourceSets.main.java {
    exclude 'org/antarcticgardens/cna/data/CNABlockStateGen.java'
    exclude 'org/antarcticgardens/cna/data/CNAGeneratedEntriesProvider.java'
    exclude 'org/antarcticgardens/cna/data/CreateNewAgeDatagen.java'
    exclude 'org/antarcticgardens/cna/data/recipe/**'
    exclude 'org/antarcticgardens/cna/content/motor/MotorBlockStateGen.java'

    // Phase 5 of the port (see PORTING.md): re-enabled once the core runs.

}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "SquidDev"
                url = "https://maven.squiddev.cc"
            }
        }
        filter {
            includeGroup "cc.tweaked"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "TeamReborn"
                url = "https://maven.modmuss50.me/"
            }
        }
        filter {
            includeGroup "teamreborn"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Shedaniel"
                url = "https://maven.shedaniel.me/"
            }
        }
        filter {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Architectury"
                url = "https://maven.architectury.dev/"
            }
        }
        filter {
            includeGroup "dev.architectury"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 1.21.8 is still obfuscated: compiled against Mojang names, remapped to intermediary for the jar.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The fabric-api artifact only nests the module jars, so each module used must be named.
    modImplementation fabricApi.module("fabric-api-base", project.fabric_version)
    modImplementation fabricApi.module("fabric-api-lookup-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-item-group-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-networking-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-object-builder-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-resource-conditions-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-resource-loader-v0", project.fabric_version)
    modImplementation fabricApi.module("fabric-transfer-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-biome-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-rendering-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-recipe-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-model-loading-api-v1", project.fabric_version)
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "maven.modrinth:create-fly:${project.create_fly_version}"

    modImplementation include("teamreborn:energy:${project.team_reborn_energy_version}")

    // REI finds the plugins through the rei_common and rei_client entrypoints; optional at runtime.
    // (JEI on Fabric 1.21.8 gets no recipes from the server, and Create Fly 1.21.8 only supports REI.)
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
    modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
    // REI's geometry types (me.shedaniel.math), nested in Cloth Config
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    // Peripherals are only registered when CC: Tweaked is installed.
    // Not transitive: its POM pulls the whole fabric-api, whose interface injections then name
    // modules that are not on the compile classpath.
    modCompileOnly("cc.tweaked:cc-tweaked-${project.cct_minecraft_version}-fabric-api:${project.cct_version}") { transitive = false }
    modCompileOnly("cc.tweaked:cc-tweaked-${project.cct_minecraft_version}-core-api:${project.cct_version}") { transitive = false }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filteringCharset = 'UTF-8'

    def props = [
            version                 : project.version,
            minecraft_version       : project.minecraft_version,
            loader_version          : project.loader_version,
            create_fly_version_range: project.create_fly_version_range,
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    // While porting, the full error list is the worklist, not javac's default first 100.
    it.options.compilerArgs << '-Xmaxerrs' << '10000'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("CREDITS.md")
}

// Automated in-game rendering check: ./gradlew runClientGameTest builds a test scene with every
// block, takes screenshots into build/run/clientGameTest/screenshots and exits. Not shipped.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "create_new_age_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    modGametestImplementation fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
    // REI in the test run only, to screenshot the energising category
    modGametestImplementation("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
    modGametestRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") { transitive = false }
    modGametestImplementation("dev.architectury:architectury-fabric:${project.architectury_version}") { transitive = false }
    modGametestImplementation("maven.modrinth:cloth-config:${project.cloth_config_version}") { transitive = false }
    gametestImplementation "me.shedaniel.cloth:basic-math:0.6.1"
    // CC: Tweaked in the test run only, to check that the peripherals are found
    modGametestImplementation("cc.tweaked:cc-tweaked-${project.cct_minecraft_version}-fabric-api:${project.cct_version}") { transitive = false }
    modGametestImplementation("cc.tweaked:cc-tweaked-${project.cct_minecraft_version}-core-api:${project.cct_version}") { transitive = false }
    modGametestRuntimeOnly("cc.tweaked:cc-tweaked-${project.cct_minecraft_version}-fabric:${project.cct_version}") { transitive = false }
    // The dev runtime does not load the libraries CC: Tweaked nests; these are the ones its POM lists.
    gametestRuntimeOnly "com.electronwill.night-config:core:3.8.1"
    gametestRuntimeOnly "com.electronwill.night-config:toml:3.8.1"
    gametestRuntimeOnly "cc.tweaked:cobalt:0.9.6"
    gametestRuntimeOnly "com.jcraft:jzlib:1.1.3"
    gametestRuntimeOnly "io.netty:netty-codec-http:4.1.118.Final"
    gametestRuntimeOnly "io.netty:netty-codec-socks:4.1.118.Final"
    gametestRuntimeOnly "io.netty:netty-handler-proxy:4.1.118.Final"
}
