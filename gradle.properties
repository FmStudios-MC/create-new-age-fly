org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache here; Create Fly disables it too.
org.gradle.configuration-cache=false

# Fabric, see https://fabricmc.net/develop
minecraft_version=1.21.10
loader_version=0.18.4
loom_version=1.16-SNAPSHOT
fabric_version=0.138.4+1.21.10

# Create Fly bundles Create, Flywheel, Ponder and Catnip.
create_fly_version=1.21.10-6.0.9-2
create_fly_version_range=>=6.0.9-2

# Modrinth version id of jei-1.21.10-fabric-26.3.0.31 (the bare version number is shared across loaders)
jei_version=8yGN172x

# CC: Tweaked has no 1.21.10 build. The peripherals compile against the 1.21.11 API (only a few
# interfaces); they stay dormant unless a computercraft mod is installed.
cct_minecraft_version=1.21.11
cct_version=1.117.1

# Replaces Antarctic Gardens' ESL (Energy Storage Library) on Fabric.
team_reborn_energy_version=4.2.0

# Mod
mod_id=create_new_age
mod_version=1.2.1-fly.1.21.10-beta.1
maven_group=org.antarcticgardens
archives_base_name=create-new-age-fly
